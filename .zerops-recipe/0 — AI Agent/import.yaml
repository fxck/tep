#zeropsPreprocessor=on

# AI Agent — full dev + stage pairs for agent-driven development (the topology Tep
# itself was built on). The dev half builds from git with the DEV setups, which only
# preinstall deps (npm install — no app build) and deploy the whole monorepo, then
# idle on `zsc noop`. So each dev container boots WITH the source tree + node_modules
# ready for an AI agent / developer to adopt and drive via zerops_dev_server (edit the
# mounted tree, run the real dev server). The stage half builds from git with the prod
# setups so there's always a running reference. Single-node stores, non-HA.

project:
  name: tep-agent
  corePackage: LIGHT
  # GOLEMIO_API_KEY is a SHARED secret — api and worker both call Golemio — so it
  # lives at project level (set once, injected into every service) rather than as a
  # per-service secret. Get a free key at https://api.golemio.cz/ and fill it in.
  envVariables:
    GOLEMIO_API_KEY:
  tags:
    - tep
    - public-transit
    - ai-agent

services:
  # ---- managed stores ----
  - hostname: db
    type: postgresql:single@18
    priority: 10
  - hostname: cache
    type: valkey:single@7.2
    priority: 10
  - hostname: analytics
    type: clickhouse:single@25.3
    priority: 10

  # ---- dev half (boots WITH source via the dev setups: npm install only, deploy the
  #      whole monorepo, then idle on `zsc noop` — ready for the agent to adopt + drive) ----
  - hostname: apidev
    type: nodejs@24
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: apidev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
  - hostname: workerdev
    type: nodejs@24
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: workerdev
    minContainers: 1
    maxContainers: 1
  - hostname: webdev
    type: nginx@1.22
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: webdev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1

  # ---- stage half (built from git; running reference) ----
  - hostname: apistage
    type: nodejs@24
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: apiprod
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
  - hostname: workerstage
    type: nodejs@24
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: workerprod
    minContainers: 1
    maxContainers: 1
  - hostname: webstage
    type: nginx@1.22
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: webprod         # builds with VITE_API_BASE=${apistage_zeropsSubdomain}
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
