#zeropsPreprocessor=on

# Remote CDE — one dev container carrying the whole monorepo (the `apidev` setup
# deploys [.] and idles via `zsc noop`), plus the backing stores. Connect your IDE /
# SSH and run api, worker and web inside it. The `app` subdomain exposes whatever
# dev server you start.

project:
  name: tep-cde
  corePackage: LIGHT
  tags:
    - tep
    - public-transit
    - remote-cde

services:
  - hostname: db
    type: postgresql:single@18
    priority: 10
  - hostname: cache
    type: valkey:single@7.2
    priority: 10
  - hostname: analytics
    type: clickhouse:single@25.3
    priority: 10

  - hostname: app
    type: nodejs@24
    priority: 5
    buildFromGit: https://github.com/fxck/tep
    zeropsSetup: apidev          # carries the whole monorepo; idles for the IDE
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    envSecrets:
      GOLEMIO_API_KEY:           # required → deploy wizard prompts
